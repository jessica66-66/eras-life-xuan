<script>window.APP_VER = 'v25';</script>
<script src="js/core.js?v=25"></script>
<script src="js/data.js?v=25"></script>
<script src="js/mod-a.js?v=25"></script>
<script src="js/mod-b.js?v=25"></script>
<script src="js/sync.js?v=25"></script>
<script src="js/app.js?v=25"></script>
<script src="js/flow.js?v=25"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    // 自我注销型 SW：注册即清除所有残留缓存并注销，之后页面完全走网络，彻底消除旧版本缓存僵局
    navigator.serviceWorker.register('sw.js?v=25', { updateViaCache: 'none' })
      .then(function(reg) { if (reg && reg.update) reg.update(); })
      .catch(function() {});
    // 若 SW 控制权发生变更（旧 SW 被新 SW 取代），刷新一次以确保加载最新页面
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function() {
      if (!reloaded && !sessionStorage.getItem('__sw_reloaded')) {
        reloaded = true; sessionStorage.setItem('__sw_reloaded', '1');
        location.reload();
      }
    });
  });
}
</script>
</body>
</html>
